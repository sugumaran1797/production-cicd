name: Deploy Flask App to AWS EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
      
      - name: Prepare target directory on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo mkdir -p /opt/devops-app
            sudo chown -R $USER:$USER /opt/devops-app

      - name: Copy updated application files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "app/*,ansible/prometheus.yml"
          target: "/opt/devops-app"
          strip_components: 1

      - name: Rebuild and restart Flask container on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker build -t devops-app:prod /opt/devops-app
            sudo docker rm -f devops-app || true
            sudo docker run -d \
              --name devops-app \
              --network devops-net \
              --restart unless-stopped \
              -p 5000:5000 \
              devops-app:prod
